<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="最终幻想14社区热帖聚合页，读取预生成 JSON 缓存展示 NGA 热门讨论。"
    />
    <title>FF14 热议板块</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero-panel">
        <div class="hero-panel__art" aria-hidden="true">
          <img
            src="./assets/ff14-crystal.svg"
            alt=""
          />
        </div>
        <div class="hero-panel__content">
          <p class="eyebrow">NGA / Final Fantasy XIV</p>
          <h1>FF14 热议板块</h1>
          <p class="summary">按回复热度和最新回复聚合社区讨论，链接跳转到原帖。</p>
        </div>
        <div class="hero-panel__meta">
          <span id="statusBadge">读取中</span>
          <time id="updatedAt">--</time>
        </div>
      </section>

      <section class="toolbar" aria-label="筛选工具">
        <label class="search-box">
          <span>搜索</span>
          <input id="keywordInput" type="search" placeholder="标题、作者、TID" autocomplete="off" />
        </label>
        <div class="sort-control" role="group" aria-label="排序方式">
          <button class="is-active" type="button" data-sort="hot">回复数</button>
          <button type="button" data-sort="latest">最新回复</button>
        </div>
      </section>

      <section class="content-grid">
        <section class="post-panel" aria-label="热门帖子列表">
          <header class="section-header">
            <h2>热门帖子</h2>
            <span id="postCount">0 条</span>
          </header>
          <div id="postList" class="post-list" aria-live="polite"></div>
        </section>

        <aside class="side-panel" aria-label="数据说明">
          <h2>数据链路</h2>
          <ol>
            <li>定时任务抓取 NGA FF14 板块列表页。</li>
            <li>解析标题、TID、作者、回复数、最后回复时间。</li>
            <li>生成 `ff14-hot.json` 并上传到对象存储。</li>
            <li>本页面只读取 JSON 缓存，不直接请求 NGA。</li>
          </ol>
          <a class="source-link" href="https://bbs.nga.cn" target="_blank" rel="noreferrer">打开 NGA</a>
        </aside>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
